name: Build LUMORA Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build LUMORA
        run: npm run dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: LUMORA-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
